# traffic/services/mosquitto.conf — Mosquitto MQTT-over-TLS configuration
# Listens on 8883 with TLS 1.2/1.3

listener 8883 0.0.0.0
protocol mqtt

certfile traffic/certs/server.crt
keyfile traffic/certs/server.key
tls_version tlsv1.2

allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

